<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere Architect | 大氣架構師</title>
    <link rel="stylesheet" href="Weather/css/style.css">
    <link rel="stylesheet" href="Weather/css/onboarding.css">
</head>
<body>
    <!-- 模塊 0: 引導教程 -->
    <div id="onboarding-screen" class="screen active">
        <div class="onboarding-container">
            <div class="terminal-window">
                <div class="terminal-header">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                    <span class="terminal-title">ATMOSPHERE_SYSTEM_v1.0</span>
                </div>
                <div class="terminal-body">
                    <div id="typewriter-text" class="typewriter"></div>
                    <span id="cursor" class="cursor">_</span>
                </div>
            </div>
            
            <button id="ignite-btn" class="ignite-button hidden">
                <span class="btn-icon">☀</span>
                <span class="btn-text">啟動太陽 IGNITE SUN</span>
                <span class="btn-glow"></span>
            </button>
        </div>
        
        <!-- 背景粒子效果 -->
        <canvas id="particle-bg"></canvas>
    </div>

    <!-- 模塊 1: 全球氣候實驗室 (待實現) -->
    <div id="global-lab-screen" class="screen">
        <div class="module-placeholder">
            <h1>模塊 1: 全球氣候實驗室</h1>
            <p>即將加載...</p>
        </div>
    </div>

    <!-- 模塊 2: 中國季風系統 (待實現) -->
    <div id="regional-screen" class="screen">
        <div class="module-placeholder">
            <h1>模塊 2: 中國季風系統</h1>
            <p>即將加載...</p>
        </div>
    </div>

    <!-- 模塊 3: 災害應對工程 (待實現) -->
    <div id="disaster-screen" class="screen">
        <div class="module-placeholder">
            <h1>模塊 3: 災害應對工程</h1>
            <p>即將加載...</p>
        </div>
    </div>

    <!-- 導航欄 (啟動後顯示) -->
    <nav id="main-nav" class="hidden">
        <div class="nav-brand">ATMOSPHERE ARCHITECT</div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="global-lab-screen">全球實驗室</button>
            <button class="nav-btn" data-target="regional-screen">區域季風</button>
            <button class="nav-btn" data-target="disaster-screen">災害工程</button>
        </div>
    </nav>

    <script src="Weather/js/state.js"></script>
    <script src="Weather/js/onboarding.js"></script>
    <script src="Weather/js/main.js"></script>
</body>
</html>
